name: Bug report
description: Report a reproducible bug
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include exact steps and sample code if possible
    validations:
      required: true
  - type: input
    id: package_version
    attributes:
      label: Package version
      placeholder: 1.0.1
    validations:
      required: true
  - type: input
    id: laravel_version
    attributes:
      label: Laravel version
      placeholder: 11.x
    validations:
      required: true
  - type: input
    id: php_version
    attributes:
      label: PHP version
      placeholder: 8.2
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error output
      description: Stack trace or logs
