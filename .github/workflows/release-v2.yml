name: Release LaraPost v2.0.0

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write

jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - name: Refuse to tag a stale main commit
        run: |
          git fetch origin main --depth=1
          test "$(git rev-parse origin/main)" = "$RELEASE_SHA"

      - name: Publish v2.0.0
        run: |
          if gh release view v2.0.0 >/dev/null 2>&1; then
            echo "v2.0.0 already exists; leaving the release unchanged."
          else
            gh release create v2.0.0 \
              --target "$RELEASE_SHA" \
              --title "LaraPost v2.0.0" \
              --notes "LaraPost 2.0 is the production hardening release. Highlights: PHP 8.3+ with Laravel 12 and 13, protected operator routes, hardened queued and scheduled delivery, token refresh support, selective providers, TikTok upload-to-inbox by default with explicit Direct Post opt-in, optional authenticated MCP integration, production diagnostics, and rebuilt documentation. See CHANGELOG.md and UPGRADE.md for details."
          fi

      - name: Remove inactive maintenance and preparation branches
        run: |
          for branch in "1.x" "release/v2-final-hardening"; do
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" >/dev/null 2>&1; then
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
              echo "Deleted $branch"
            fi
          done
