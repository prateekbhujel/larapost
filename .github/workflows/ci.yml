name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.3'
            laravel: '12'
            testbench: '^10.8'
          - php: '8.4'
            laravel: '12'
            testbench: '^10.8'
          - php: '8.4'
            laravel: '13'
            testbench: '^11.0'
          - php: '8.5'
            laravel: '13'
            testbench: '^11.0'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: mbstring, json, pdo_sqlite, openssl

      - name: Validate composer.json
        run: composer validate --strict --no-check-lock

      - name: Select Laravel testbench
        run: composer require --dev orchestra/testbench:"${{ matrix.testbench }}" --no-update --no-interaction

      - name: Install dependencies
        run: composer update --with-all-dependencies --prefer-dist --no-interaction --no-progress

      - name: Security audit
        run: composer audit --locked

      - name: Run tests
        run: composer test
